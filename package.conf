# package.conf -- how the pdk's package.yml builds this repository's SIS file (release.yml): the VirtualBox guest additions for Phorepoc
# (phase 1: the service and the shared clipboard). The service is built against core alone; the kernel side is the PC image's PheVmmDev channel.
NAME=phevbox-additions
ARCHES="x32"
REPOS_x32=""
COMPONENTS_x32="phevboxsvc"
# the add-on archive is of no use (the files are packaged by recipes/pack.py): the SIS file is the product
ADDON=0
